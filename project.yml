name: whereismoney
options:
  bundleIdPrefix: com.wllx
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "S4XZC6528L"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES

targets:
  # 主 App
  whereismoney:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: whereismoney
        excludes:
          - "Info.plist"
          - "Assets.xcassets/**"
    info:
      path: whereismoney/Info.plist
      properties:
        CFBundleDisplayName: whereismoney
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wllx.app
        PRODUCT_NAME: whereismoney
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: whereismoney/Info.plist
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  # 小组件 Extension
  WhereIsMoneyWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WhereIsMoneyWidget
        excludes:
          - "Info.plist"
      # 共享主 App 的模型文件，使 Widget 能读取 SwiftData 共享存储
      - path: whereismoney/Models
      - path: whereismoney/Utils/AppConstants.swift
    info:
      path: WhereIsMoneyWidget/Info.plist
      properties:
        CFBundleDisplayName: 财务概览
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wllx.app.WhereIsMoneyWidget
        PRODUCT_NAME: WhereIsMoneyWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WhereIsMoneyWidget/Info.plist
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: whereismoney
        embed: true
